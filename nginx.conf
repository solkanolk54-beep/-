# ==============================================================================
# منظومة كَرِيمَة للرقابة الشاملة والشفافية الرقمية (Kareema Nginx Gateway)
# إعدادات الأمان السحابي المشددة وتفعيل بروتوكول TLS 1.3
# ==============================================================================

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # حظر الكشف عن إصدار الخادم
    server_tokens off;

    # تحسين أداء نقل البيانات
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # تحديد سقف سرعة الطلبات للحماية من هجمات DDoS (Rate Limiting)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:20m;

    # تكوين شهادات وتشفير TLS 1.3 الصارم
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256';
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ترويسات الأمان المشددة (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # توجيه تلقائي من HTTP إلى HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name kareema.agriculture.gov.dz;
        return 301 https://$host$request_uri;
    }

    # خادم HTTPS الآمن
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name kareema.agriculture.gov.dz;

        ssl_certificate /etc/nginx/ssl/kareema-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/kareema-key.pem;
        ssl_client_certificate /etc/nginx/ssl/kareema-ca.pem;

        # توجيه طلبات واجهات البرمجة إلى خادم Node.js
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn addr_limit 50;

            proxy_pass http://api:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        # خدمة واجهة الويب والتطبيقات
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1d;
        }
    }
}
